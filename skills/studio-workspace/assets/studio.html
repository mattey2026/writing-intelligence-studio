<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Writing Intelligence Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F3F7;--surface:#FFFFFF;--ink:#1E1B2E;--muted:#625E77;--line:#DEDBE8;
  --accent:#4B2E83;--accent-ink:#FFFFFF;--accent-soft:#ECE6F7;--mark:#F6D86B;--mark-ink:#1E1B2E;
  --danger:#B3261E;--ok:#2E7D4F;--warn:#8A5A00;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-s:4px;--r-m:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15131C;--surface:#1D1A27;--ink:#ECE9F5;--muted:#A29DB8;--line:#322D42;
  --accent:#B9A2FF;--accent-ink:#15131C;--accent-soft:#2B2440;--mark:#7A6418;--mark-ink:#FFF6D6;
  --danger:#FF8A80;--ok:#7BD39B;--warn:#E8B85A;}}
:root[data-theme="dark"]{
  --paper:#15131C;--surface:#1D1A27;--ink:#ECE9F5;--muted:#A29DB8;--line:#322D42;
  --accent:#B9A2FF;--accent-ink:#15131C;--accent-soft:#2B2440;--mark:#7A6418;--mark-ink:#FFF6D6;
  --danger:#FF8A80;--ok:#7BD39B;--warn:#E8B85A;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
img{max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);font-size:19px;font-weight:600;white-space:nowrap;background:none;border:0;padding:0;cursor:pointer}
.nav{display:flex;gap:2px;overflow-x:auto;flex:1}
.nav button{background:none;border:0;padding:7px 11px;border-radius:var(--r-s);cursor:pointer;color:var(--muted);white-space:nowrap;font-weight:500}
.nav button[aria-current="page"]{color:var(--ink);background:var(--accent-soft)}
.nav button:hover{color:var(--ink)}
.store-pill{font-size:12px;color:var(--muted);white-space:nowrap}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:var(--r-s);cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.55;cursor:progress}
.btn.sm{padding:4px 9px;font-size:13px}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:7px 9px}
textarea.in{resize:vertical;min-height:80px;line-height:1.45}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.status-supported{color:var(--ok)} .status-unsupported,.status-contradicted{color:var(--danger)} .status-needs-source{color:var(--warn)}
mark.ns{background:var(--mark);color:var(--mark-ink);padding:0 3px;border-radius:2px;font-family:var(--sans);font-size:.8em}
mark.ex{background:var(--mark);color:var(--mark-ink);padding:0 3px;border-radius:2px}
sup.cite a{color:var(--accent);text-decoration:none;font-family:var(--sans);font-size:.75em}

/* layout */
main{max-width:1400px;margin:0 auto}
.page{padding:32px 24px 64px;max-width:1040px;margin:0 auto}
h1.page-title{font-family:var(--serif);font-weight:500;font-size:34px;margin:0 0 6px}
h2.sec{font-size:15px;font-weight:600;margin:32px 0 10px}
.list{border-top:1px solid var(--line)}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--line)}
.item .t{font-family:var(--serif);font-size:18px;font-weight:500;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.item .t:hover{color:var(--accent)}
.empty{padding:28px;border:1px dashed var(--line);border-radius:var(--r-m);color:var(--muted)}

/* home */
.hero{padding:56px 0 28px}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(36px,6vw,64px);line-height:1.05;letter-spacing:-.01em;margin:0 0 22px;max-width:14ch}
.ask{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px}
.ask textarea{border:0;background:none;font-family:var(--serif);font-size:21px;line-height:1.4;resize:none;min-height:92px;outline:none;width:100%}
.ask textarea:focus-visible{outline:none}
.ask:focus-within{border-color:var(--accent)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:32px}
@media (max-width:800px){.cols{grid-template-columns:1fr}}

/* editor */
.editor{display:grid;grid-template-columns:240px minmax(0,1fr) 360px;height:calc(100vh - 57px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:520px}
.pane{overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:16px}
.pane.right{border-right:0;border-left:1px solid var(--line)}
.steps{list-style:none;margin:0 0 18px;padding:0;counter-reset:s}
.steps li{counter-increment:s}
.steps button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:7px 8px;border-radius:var(--r-s);cursor:pointer;color:var(--muted)}
.steps button::before{content:counter(s);display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);font-size:12px;flex:none}
.steps button[aria-current="step"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.steps button[aria-current="step"]::before{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps button.done::before{border-color:var(--accent);color:var(--accent)}
.pane h3{font-size:13px;font-weight:600;color:var(--muted);margin:16px 0 6px}
.outline button{display:block;width:100%;text-align:left;background:none;border:0;padding:4px 6px;cursor:pointer;border-radius:var(--r-s);font-size:13px;color:var(--ink)}
.outline button:hover{background:var(--accent-soft)}
.outline .l3{padding-left:18px;color:var(--muted)}
.canvas{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.ctool{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.seg button{border:0;background:none;padding:5px 12px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);font-weight:600}
.meta{font-size:12px;color:var(--muted)}
.sheet{flex:1;overflow-y:auto;padding:32px 24px 80px}
.sheet-inner{max-width:68ch;margin:0 auto}
.doc-title{display:block;resize:none;overflow:hidden;width:100%;border:0;background:none;font-family:var(--serif);font-size:32px;font-weight:500;line-height:1.2;padding:0;margin:0 0 18px;outline:none}
.doc-body{overflow:hidden;width:100%;border:0;background:none;font-family:var(--serif);font-size:19px;line-height:1.7;resize:none;outline:none;min-height:60vh;padding:0}
.reader{font-family:var(--serif);font-size:19px;line-height:1.7}
.reader h1{font-size:30px;font-weight:500;line-height:1.2}
.reader h2{font-size:24px;font-weight:500;margin-top:1.6em}
.reader h3{font-size:20px;font-weight:600}
.reader blockquote{margin:1em 0;padding-left:16px;border-left:3px solid var(--accent);color:var(--muted)}
.reader pre{background:var(--paper);padding:12px;border-radius:var(--r-s);overflow-x:auto;font-size:14px}
.reader table{border-collapse:collapse;display:block;overflow-x:auto}
.reader td,.reader th{border:1px solid var(--line);padding:6px 10px;font-family:var(--sans);font-size:14px}
.reader a{color:var(--accent)}
.reader .video a{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;font-family:var(--sans);font-size:15px;text-decoration:none;color:var(--ink)}
.reader .video a:hover{border-color:var(--accent)}
.refs{margin-top:2.2em;padding-top:1em;border-top:1px solid var(--line);font-size:15px}
.refs li{margin-bottom:6px}
.figure{margin:0 0 1.6em}
.figure figcaption{font-family:var(--sans);font-size:13px;color:var(--muted);margin-top:6px}
.mtabs{display:none}
@media (max-width:1000px){
  .editor{grid-template-columns:1fr;height:auto;min-height:0}
  .editor>*{display:none}
  .editor[data-m="steps"] .left,.editor[data-m="write"] .canvas,.editor[data-m="tool"] .right{display:flex;flex-direction:column}
  .editor[data-m="steps"] .left{display:block}.editor[data-m="tool"] .right{display:block}
  .pane{border:0}
  .sheet{overflow:visible}
  .mtabs{display:flex;position:sticky;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .mtabs button{flex:1;border:0;background:none;padding:8px;border-radius:var(--r-s);cursor:pointer}
  .mtabs button[aria-pressed="true"]{background:var(--accent-soft);font-weight:600}
  .top{padding:8px 12px;gap:10px}.store-pill{display:none}
}

/* tool panel */
.tool h2{font-family:var(--serif);font-size:22px;font-weight:500;margin:0 0 4px}
.tool p.lead{color:var(--muted);font-size:13px;margin:0 0 12px}
.card{border:1px solid var(--line);border-radius:var(--r-m);padding:12px;margin:10px 0;background:var(--surface)}
.qbox{background:var(--accent-soft);border-radius:var(--r-m);padding:12px;margin-bottom:12px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent)}
.score{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;font-size:13px;margin:8px 0}
.score>strong{white-space:nowrap;text-align:right}
.thumb{border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;background:var(--paper)}
.thumb img{display:block;width:100%}
.stream{white-space:pre-wrap;font-family:var(--serif);font-size:15px;max-height:260px;overflow:auto;background:var(--paper);padding:10px;border-radius:var(--r-s)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* modal & toast */
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(20,16,32,.45);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:var(--r-m);max-width:min(1000px,100%);width:100%;max-height:90vh;display:flex;flex-direction:column;border:1px solid var(--line)}
.modal header{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h2{margin:0;font-family:var(--serif);font-weight:500;font-size:22px;flex:1}
.modal .mb{padding:18px;overflow:auto}
.modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.diff{font-family:var(--serif);font-size:17px;line-height:1.7;white-space:pre-wrap}
.diff ins{background:color-mix(in srgb,var(--ok) 22%,transparent);text-decoration:none}
.diff del{background:color-mix(in srgb,var(--danger) 18%,transparent);text-decoration:line-through}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:var(--r-m);font-size:14px;max-width:90vw}
.splash{display:grid;place-items:center;min-height:60vh;color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <button class="brand" id="brand">Writing Studio</button>
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <span class="store-pill" id="storePill"></span>
</header>
<main id="main"><div class="splash"><span><span class="spin"></span> Opening your studio</span></div></main>
<div id="toasts" aria-live="polite"></div>
<script>
"use strict";
/* ================= utilities ================= */
const $=(s,r=document)=>r.querySelector(s);
function h(tag,props,...kids){const el=document.createElement(tag);
  for(const[k,v]of Object.entries(props||{})){if(v==null||v===false)continue;
    if(k==="class")el.className=v;else if(k==="style")el.style.cssText=v;
    else if(k.startsWith("on"))el.addEventListener(k.slice(2),v);
    else if(k==="html")el.innerHTML=v;else if(k==="value")el.value=v;
    else if(typeof v==="boolean")el[k]=v;else el.setAttribute(k,v);}
  for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;el.append(c instanceof Node?c:document.createTextNode(String(c)));}
  return el;}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const now=()=>new Date().toISOString();
const fmtDate=s=>{try{return new Date(s).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}catch{return""}};
const words=t=>(t||"").trim().split(/\s+/).filter(Boolean).length;
const clip=(t,n)=>(t||"").length>n?(t.slice(0,n)+"\n[...truncated]"):(t||"");
function toast(msg){const t=h("div",{class:"toast"},msg);$("#toasts").append(t);setTimeout(()=>t.remove(),4200);}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}
function modal(title,body,actions=[]){const bg=h("div",{class:"modal-bg",role:"dialog","aria-modal":"true","aria-label":title});
  const close=()=>{bg.remove();document.removeEventListener("keydown",onKey);};
  const onKey=e=>{if(e.key==="Escape")close();};document.addEventListener("keydown",onKey);
  bg.addEventListener("click",e=>{if(e.target===bg)close();});
  const foot=h("footer",null,actions.map(a=>h("button",{class:"btn "+(a.kind||""),onclick:async()=>{if(a.run){const r=await a.run();if(r===false)return;}close();}},a.label)));
  bg.append(h("div",{class:"modal"},h("header",null,h("h2",null,title),h("button",{class:"btn ghost",onclick:close,"aria-label":"Close"},"Close")),h("div",{class:"mb"},body),actions.length?foot:null));
  document.body.append(bg);(bg.querySelector("button.primary")||bg.querySelector(".mb input,.mb textarea,.mb button")||bg.querySelector("button"))?.focus();return close;}
function askText(title,label,def=""){return new Promise(res=>{const t=h("input",{class:"in",value:def});let done=false;
  modal(title,h("div",null,h("label",{class:"f"},label),t),[{label:"Cancel",run:()=>{done=true;res(null);}},{label:"OK",kind:"primary",run:()=>{done=true;res(t.value.trim());}}]);
  t.addEventListener("keydown",e=>{if(e.key==="Enter"){document.querySelector(".modal-bg footer .primary")?.click();}});});}
const arr=x=>Array.isArray(x)?x:(x==null||x===""?[]:[x]);
function logErr(where,e){try{console.error(where,e);if(Store.mode!=="cloud")return;const rec={id:uid(),at:now(),where:String(where).slice(0,80),name:String(e&&e.name||""),code:String(e&&e.code||""),message:String(e&&e.message||e).slice(0,500),stack:String(e&&e.stack||"").slice(0,1500),step:ed.step,view:app.view,doc:app.cur?app.cur.id:"",ua:navigator.userAgent.slice(0,200)};
  Store.db.collection(Store.path("errors")).doc(rec.id).set(rec).catch(()=>{});}catch{}}
window.addEventListener("error",ev=>logErr("window",ev.error||ev.message));
window.addEventListener("unhandledrejection",ev=>logErr("promise",ev.reason));
async function busy(btn,label,fn){const old=btn?[...btn.childNodes]:null;if(btn){btn.disabled=true;btn.replaceChildren(h("span",{class:"spin"}),label);}
  try{return await fn();}catch(e){if(!e||!e.code||e instanceof Error)logErr("action: "+label,e);toast(errMsg(e));}finally{if(btn){btn.disabled=false;btn.replaceChildren(...old);}}}
function errMsg(e){const c=e&&e.code;
  if(c==="not_granted")return"Claude access was declined for this page. Reload the page and allow it to use Claude.";
  if(c==="rate_limited")return"Too many requests at once. Wait a moment, then try again.";
  if(c==="aborted"||e?.name==="AbortError")return"Stopped.";
  if(c==="unavailable")return e.message||"Claude isn't available in this view. Open the studio inside Claude.";
  if(c==="save_failed")return e.message;
  if(["invalid_argument","resource_exhausted","quota_exceeded","revoked"].includes(c))return"Couldn't save to your online library just now. Your work is kept in this browser.";
  if(c)return"Claude couldn't finish that request. Try again in a moment.";
  if(e instanceof Error)return"Something went wrong ("+String(e.message||e.name).slice(0,140)+"). Try again; if it repeats, tell Claude in chat.";
  return (e&&e.message)||"Something went wrong. Try again.";}

/* ================= settings ================= */
const settings=Object.assign({theme:"system",tier:"default",citation:"apa",research:"sources"},(()=>{try{return JSON.parse(localStorage.getItem("wis:settings")||"{}")}catch{return{}}})());
function saveSettings(){try{localStorage.setItem("wis:settings",JSON.stringify(settings))}catch{}applyTheme();}
function applyTheme(){if(settings.theme==="system")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",settings.theme);}
applyTheme();

/* ================= storage ================= */
const KINDS=["docs","voices","sources","versions"];
const Store={mode:"local",db:null,uid:null,data:{docs:[],voices:[],sources:[],versions:[]},
  async init(){
    if(window.claude&&claude.use){
      try{const[db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
        const id=user?await user.id():null;
        if(db&&id){this.db=db;this.uid=id;this.mode="cloud";}}catch{}}
    for(const k of KINDS)this.data[k]=await this.load(k);
    this.data.docs.sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""));},
  path(k){return"data/users/"+this.uid+"/lib/"+k;},
  key(k){return"wis:"+(this.mode==="cloud"&&this.uid?this.uid+":":"")+k;},
  async load(k){let local=[];try{local=JSON.parse(localStorage.getItem(this.key(k))||"[]")}catch{}
    if(this.mode!=="cloud")return local;
    let cloud=[];try{const s=await this.db.collection(this.path(k)).get();cloud=s.docs.map(d=>d.data()).filter(Boolean).map(x=>JSON.parse(JSON.stringify(x)));}catch(e){toast("Your online library didn't load, so you're seeing the copy saved in this browser.");return local;}
    const byId=new Map(cloud.map(x=>[x.id,x]));const pending=[];
    for(const x of local){const c=byId.get(x.id);if(!c||(x.updatedAt||x.createdAt||"")>(c.updatedAt||c.createdAt||"")){byId.set(x.id,x);pending.push(x);}}
    for(const x of pending)this.db.collection(this.path(k)).doc(x.id).set(JSON.parse(JSON.stringify(x))).catch(()=>{});
    return[...byId.values()];},
  async put(k,obj){const clean=JSON.parse(JSON.stringify(obj));const arr=this.data[k];const i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]=obj;else arr.unshift(obj);
    let localOk=true;try{localStorage.setItem(this.key(k),JSON.stringify(arr))}catch{localOk=false;}
    if(this.mode==="cloud"){try{await this.db.collection(this.path(k)).doc(obj.id).set(clean);}catch(e){throw{code:"save_failed",local:localOk,message:localOk?"Couldn't save to your online library just now. Your work is safe in this browser and will sync on your next visit.":"Couldn't save your work. Copy or export it from Publish before closing this page."};}}
    else if(!localOk)throw{message:"This browser's storage is full. Export your library from Settings."};},
  async remove(k,id){this.data[k]=this.data[k].filter(x=>x.id!==id);
    try{localStorage.setItem(this.key(k),JSON.stringify(this.data[k]))}catch{}
    if(this.mode==="cloud"){try{await this.db.collection(this.path(k)).doc(id).delete();}catch{throw{message:"Couldn't delete it from your online library. Try again in a moment."};}}}};

/* ================= markdown ================= */
function inl(s,srcMap){let t=esc(s);
  t=t.replace(/`([^`]+)`/g,"<code>$1</code>");
  t=t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<em>$2</em>");
  t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  t=t.replace(/\[needs source\]/gi,'<mark class="ns">needs source</mark>');
  t=t.replace(/\[(Add your own example:[^\]]*)\]/g,'<mark class="ex">$1</mark>');
  t=t.replace(/\[S(\d+)\]/g,(m,n)=>{const i=srcMap?srcMap.get(+n):null;return i?`<sup class="cite"><a href="#ref-${i}">[${i}]</a></sup>`:`<sup class="cite"><a>[S${n}?]</a></sup>`;});
  return t;}
function md(src,srcMap){const L=(src||"").replace(/\r/g,"").split("\n");const out=[];let i=0;
  const isBlock=l=>/^(#{1,4}\s|>|```|\s*[-*]\s|\s*\d+\.\s)/.test(l)||/^\|/.test(l);
  while(i<L.length){const l=L[i];let m;
    if(/^```/.test(l)){const c=[];i++;while(i<L.length&&!/^```/.test(L[i]))c.push(L[i++]);i++;out.push("<pre><code>"+esc(c.join("\n"))+"</code></pre>");continue;}
    if(m=l.match(/^(#{1,4})\s+(.*)/)){const n=m[1].length;out.push(`<h${n} data-line="${i}">${inl(m[2],srcMap)}</h${n}>`);i++;continue;}
    if(/^>/.test(l)){const q=[];while(i<L.length&&/^>/.test(L[i]))q.push(L[i++].replace(/^>\s?/,""));out.push("<blockquote>"+inl(q.join(" "),srcMap)+"</blockquote>");continue;}
    if(/^\s*[-*]\s+/.test(l)){const it=[];while(i<L.length&&/^\s*[-*]\s+/.test(L[i]))it.push("<li>"+inl(L[i++].replace(/^\s*[-*]\s+/,""),srcMap)+"</li>");out.push("<ul>"+it.join("")+"</ul>");continue;}
    if(/^\s*\d+\.\s+/.test(l)){const it=[];while(i<L.length&&/^\s*\d+\.\s+/.test(L[i]))it.push("<li>"+inl(L[i++].replace(/^\s*\d+\.\s+/,""),srcMap)+"</li>");out.push("<ol>"+it.join("")+"</ol>");continue;}
    if(/^\|/.test(l)&&i+1<L.length&&/^\|?\s*:?-{3,}/.test(L[i+1])){const row=r=>r.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const head=row(l);i+=2;const rows=[];while(i<L.length&&/^\|/.test(L[i]))rows.push(row(L[i++]));
      out.push("<table><thead><tr>"+head.map(c=>"<th>"+inl(c,srcMap)+"</th>").join("")+"</tr></thead><tbody>"+rows.map(r=>"<tr>"+r.map(c=>"<td>"+inl(c,srcMap)+"</td>").join("")+"</tr>").join("")+"</tbody></table>");continue;}
    if(m=l.trim().match(/^https?:\/\/(?:www\.|m\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{11})\S*$/)){const u=l.trim();const sv=Store.data.sources.find(x=>x.url===u);out.push(`<p class="video" data-yt="${m[1]}"><a href="${esc(u)}" target="_blank" rel="noopener"><span aria-hidden="true">&#9654;</span> ${esc(sv?.title||"Watch on YouTube")}</a></p>`);i++;continue;}
    if(/^(-{3,}|\*{3,})$/.test(l.trim())){out.push("<hr>");i++;continue;}
    if(!l.trim()){i++;continue;}
    const p=[l];i++;while(i<L.length&&L[i].trim()&&!isBlock(L[i]))p.push(L[i++]);out.push("<p>"+inl(p.join(" "),srcMap)+"</p>");}
  return out.join("\n");}

/* ================= citations ================= */
function docSources(d){return d.sourceIds.map(id=>Store.data.sources.find(s=>s.id===id)).filter(Boolean);}
function citedMap(d){const srcs=docSources(d);const map=new Map();let n=0;
  for(const m of d.body.matchAll(/\[S(\d+)\]/g)){const k=+m[1];if(!map.has(k)&&srcs[k-1])map.set(k,++n);}return{map,srcs};}
function year(s){const m=(s.date||"").match(/\d{4}/);return m?m[0]:"n.d.";}
function formatRef(s,style,n){const a=s.author||s.publisher||"Unknown author";const t=s.title||"Untitled";const u=s.doi?("https://doi.org/"+s.doi.replace(/^https?:\/\/doi.org\//,"")):(s.url||"");
  const acc=s.accessed?fmtDate(s.accessed):"";
  switch(style){
   case"mla":return`${a}. "${t}." ${s.publisher?s.publisher+", ":""}${s.date||"n.d."}${u?", "+u:""}.`;
   case"chicago":return`${a}. "${t}." ${s.publisher?s.publisher+", ":""}${s.date||"n.d."}.${u?" "+u+".":""}`;
   case"harvard":return`${a} (${year(s)}) ${t}. ${s.publisher?s.publisher+". ":""}${u?"Available at: "+u:""}${acc?" (Accessed: "+acc+")":""}.`;
   case"ieee":return`[${n}] ${a}, "${t}," ${s.publisher?s.publisher+", ":""}${s.date||"n.d."}.${u?" [Online]. Available: "+u:""}`;
   case"links":return`${t}${s.publisher?", "+s.publisher:""}${u?": "+u:""}`;
   default:return`${a}. (${year(s)}). ${t}.${s.publisher?" "+s.publisher+".":""}${u?" "+u:""}`;}}
function refsHTML(d){const{map,srcs}=citedMap(d);if(!map.size)return"";
  const items=[...map.entries()].sort((a,b)=>a[1]-b[1]).map(([k,n])=>{const s=srcs[k-1];const u=s.doi?("https://doi.org/"+s.doi):(s.url||"");
    let txt=esc(formatRef(s,d.citation,n));if(u)txt=txt.replace(esc(u),`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`);
    return`<li id="ref-${n}">${txt}${s.verified?"":' <mark class="ns">not yet verified</mark>'}</li>`;});
  return`<section class="refs"><h2>References</h2><ol>${items.join("")}</ol></section>`;}
function refsText(d){const{map,srcs}=citedMap(d);if(!map.size)return"";
  return"\n\n## References\n\n"+[...map.entries()].sort((a,b)=>a[1]-b[1]).map(([k,n])=>`${n}. ${formatRef(srcs[k-1],d.citation,n)}`).join("\n");}
function bodyWithNumbers(d){const{map}=citedMap(d);return d.body.replace(/\[S(\d+)\]/g,(m,k)=>map.has(+k)?`[${map.get(+k)}]`:m);}

${d.seo&&d.seo.primary?"Keywords to use naturally, especially in the title, opening and headings (never stuff them): "+[d.seo.primary,...(d.seo.secondary||[])].join(", ")+"\n":""}${ans?"Author's answers to intake questions:\n"+ans+"\n":""}
